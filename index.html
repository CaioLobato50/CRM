<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>CRM de Vendas — Caio Lobato</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#080c12;
  --navy-2:#0f141c;
  --navy-3:#161d28;
  --navy-4:#1e2736;
  --cream:#f2ede4;
  --cream-2:#e8e2d8;
  --cream-3:#cdc8be;
  --gold:#c9993a;
  --gold-2:#e0b55a;
  --gold-glow:rgba(201,153,58,0.15);
  --border:rgba(242,237,228,0.07);
  --border-gold:rgba(201,153,58,0.2);
  --text-muted:#6b7585;
  --border-radius-md:8px;
  --border-radius-lg:12px;
  --font-mono:'SF Mono','Fira Mono',monospace;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--navy);color:var(--cream);min-height:100vh}

header{background:var(--navy-2);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.logo{font-size:15px;font-weight:600;color:var(--cream)}
.logo span{color:var(--gold)}
header button{font-size:12px;padding:7px 14px;border:1px solid var(--border-gold);border-radius:var(--border-radius-md);background:var(--navy-3);color:var(--cream);cursor:pointer;transition:background 0.2s}
header button:hover{background:var(--navy-4)}
.btn-new{background:var(--gold)!important;color:var(--navy)!important;border-color:var(--gold)!important;font-weight:600!important}
.btn-new:hover{background:var(--gold-2)!important}

.main{padding:1.5rem 24px;max-width:1400px;margin:0 auto}

.tabs{display:flex;gap:4px;margin-bottom:1.5rem;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color 0.2s}
.tab.active{color:var(--cream);border-bottom-color:var(--gold);font-weight:500}
.tab:hover{color:var(--cream-3)}
.pane{display:none}.pane.active{display:block}

.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.5rem}
.metric{background:var(--navy-2);border:1px solid var(--border);border-radius:var(--border-radius-md);padding:12px 14px;position:relative;overflow:hidden}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.metric .label{font-size:12px;color:var(--text-muted);margin-bottom:4px}
.metric .value{font-size:22px;font-weight:500;color:var(--cream)}
.metric .sub{font-size:11px;color:var(--text-muted);margin-top:2px}

.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:start;overflow-x:auto}
@media(max-width:900px){.pipeline{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.pipeline{grid-template-columns:repeat(2,1fr)}}
.stage{background:var(--navy-2);border:1px solid var(--border);border-radius:var(--border-radius-md);padding:10px;min-width:160px}
.stage-title{font-size:11px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.stage-count{background:var(--navy-3);border:1px solid var(--border-gold);border-radius:10px;padding:1px 7px;font-size:11px;color:var(--gold)}
.card{background:var(--navy-3);border:1px solid var(--border);border-radius:var(--border-radius-md);padding:10px;margin-bottom:6px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--border-gold)}
.card-name{font-size:13px;font-weight:500;color:var(--cream);margin-bottom:2px}
.card-phone{font-size:11px;color:var(--text-muted);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:10px;padding:2px 7px;border-radius:10px}
.tag-meta{background:rgba(24,95,165,0.2);color:#6aaee8}
.tag-google{background:rgba(59,109,17,0.2);color:#8fc45a}
.tag-instagram{background:rgba(114,36,62,0.2);color:#e88aaa}
.tag-indicacao{background:rgba(99,56,6,0.2);color:#e0b55a}
.tag-whatsapp{background:rgba(8,80,65,0.2);color:#5dd4b0}
.tag-site{background:rgba(60,52,137,0.2);color:#a9a3f5}
.tag-outro{background:rgba(95,94,90,0.15);color:var(--cream-3)}
.add-btn{width:100%;padding:6px;font-size:12px;border:1px dashed var(--border-gold);border-radius:var(--border-radius-md);background:none;color:var(--text-muted);cursor:pointer;margin-top:4px;transition:background .15s,color .15s}
.add-btn:hover{background:var(--navy-4);color:var(--cream)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--navy-2);border-radius:var(--border-radius-lg);border:1px solid var(--border-gold);padding:1.5rem;width:460px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:500;margin-bottom:1rem;color:var(--cream)}
.form-row{margin-bottom:12px}
.form-row label{font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid var(--border);border-radius:var(--border-radius-md);padding:8px 10px;font-size:13px;background:var(--navy-3);color:var(--cream);outline:none;transition:border-color 0.2s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--border-gold)}
.form-row select option{background:var(--navy-3);color:var(--cream)}
.form-row textarea{resize:vertical;min-height:60px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
.btn-primary{background:var(--gold);color:var(--navy);border:none;border-radius:var(--border-radius-md);padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600;transition:background 0.2s}
.btn-primary:hover{background:var(--gold-2)}
.btn-sec{background:none;border:1px solid var(--border);border-radius:var(--border-radius-md);padding:8px 16px;font-size:13px;cursor:pointer;color:var(--cream);transition:background 0.2s,border-color 0.2s}
.btn-sec:hover{background:var(--navy-3);border-color:var(--border-gold)}

.copy-btn{font-size:11px;padding:5px 12px;border:1px solid var(--border-gold);border-radius:6px;background:var(--navy-3);cursor:pointer;color:var(--gold);margin-top:8px;transition:background 0.2s}
.copy-btn:hover{background:var(--navy-4)}

.origem-chart{display:flex;flex-direction:column;gap:8px;margin-top:1rem}
.origem-row{display:flex;align-items:center;gap:10px}
.origem-label{font-size:12px;color:var(--text-muted);width:130px;flex-shrink:0}
.origem-bar-wrap{flex:1;background:var(--navy-3);border-radius:4px;height:8px;overflow:hidden}
.origem-bar{height:100%;border-radius:4px;transition:width .4s ease}
.origem-count{font-size:12px;font-weight:500;color:var(--cream);width:30px;text-align:right;flex-shrink:0}
.section-title{font-size:13px;font-weight:500;color:var(--cream);margin-bottom:.75rem}

.leads-table{width:100%;border-collapse:collapse;font-size:12px}
.leads-table th{font-size:11px;color:var(--text-muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);font-weight:500;white-space:nowrap}
.leads-table td{color:var(--cream);padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.leads-table tr:hover td{background:var(--navy-2);cursor:pointer}
.filters{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.filters select,.filters input{font-size:12px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--border-radius-md);background:var(--navy-2);color:var(--cream);outline:none}
.filters select option{background:var(--navy-2)}
.filters select:focus,.filters input:focus{border-color:var(--border-gold)}

.detail-panel{background:var(--navy-2);border:1px solid var(--border-gold);border-radius:var(--border-radius-lg);padding:1.25rem;margin-top:1rem;display:none}
.detail-panel.open{display:block}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem}
.detail-name{font-size:17px;font-weight:500;color:var(--cream)}
.close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);line-height:1;transition:color 0.2s}
.close-btn:hover{color:var(--cream)}
.history-item{font-size:12px;color:var(--text-muted);padding:6px 0;border-bottom:1px solid var(--border)}
.history-item:last-child{border-bottom:none}
.history-date{font-size:10px;color:var(--text-muted)}
.add-hist{display:flex;gap:6px;margin-top:8px}
.add-hist input{flex:1;font-size:12px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--border-radius-md);background:var(--navy-3);color:var(--cream);outline:none}
.add-hist input:focus{border-color:var(--border-gold)}
.info-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:.75rem}
@media(max-width:500px){.info-row{grid-template-columns:repeat(2,1fr)}}
.info-cell .k{font-size:11px;color:var(--text-muted);margin-bottom:2px}
.info-cell .v{font-size:13px;color:var(--cream);font-weight:500}
.info-cell.wide{grid-column:1/-1}
.info-cell .v.small{font-size:12px;font-weight:400;word-break:break-all;color:var(--cream-2)}
.card-meta{font-size:11px;color:var(--text-muted);margin-top:5px}
.nota-box{font-size:12px;color:var(--text-muted);margin-bottom:1rem;padding:8px 10px;background:var(--navy-3);border-radius:var(--border-radius-md);border:1px solid var(--border)}
.action-row{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.action-row button,.action-row a button{font-size:12px;padding:6px 12px}

/* ===== Refinamento visual (so aparencia, sem mexer na logica) ===== */
:root{
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --border:rgba(242,237,228,0.06);
  --border-gold:rgba(201,153,58,0.28);
  --border-radius-md:10px;
  --border-radius-lg:16px;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--sans);font-size:14px;line-height:1.45;letter-spacing:.005em;
  background:radial-gradient(900px 420px at 85% -120px,rgba(201,153,58,.09),transparent 70%),radial-gradient(700px 380px at -10% 0,rgba(30,39,54,.55),transparent 70%),var(--navy);background-attachment:fixed}
::selection{background:rgba(201,153,58,.3);color:var(--cream)}
*{scrollbar-width:thin;scrollbar-color:var(--navy-4) transparent}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

header{background:rgba(8,12,18,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:16px 32px;border-bottom:1px solid var(--border-gold)}
.logo{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.logo::before{content:'';width:7px;height:7px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 12px rgba(201,153,58,.6)}
.logo span{font-style:italic;font-weight:500}
header button{border:1px solid var(--border);background:transparent;color:var(--cream-3);padding:8px 16px;border-radius:999px;font-weight:500;transition:all .2s}
header button:hover{background:var(--navy-3);border-color:var(--border-gold);color:var(--cream)}
.btn-new{background:linear-gradient(135deg,var(--gold-2),var(--gold))!important;color:#1a1305!important;border-color:transparent!important;box-shadow:0 6px 18px -6px rgba(201,153,58,.55)}
.btn-new:hover{transform:translateY(-1px);box-shadow:0 10px 22px -8px rgba(201,153,58,.7)}

.main{padding:2rem 32px 3rem}
.tabs{gap:28px;margin-bottom:2rem}
.tab{padding:10px 2px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.tab.active{color:var(--gold-2);font-weight:600}

.metrics{gap:14px;margin-bottom:2rem}
.metric{background:linear-gradient(180deg,var(--navy-3),var(--navy-2));border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.metric::before{height:1px;background:linear-gradient(90deg,var(--gold),transparent 70%)}
.metric .label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.metric .value{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1;color:var(--cream)}
.metric .sub{font-size:11px;margin-top:8px}

.pipeline{gap:12px}
.stage{background:rgba(15,20,28,.7);border-radius:14px;padding:12px}
.stage-title{font-size:10px;letter-spacing:.14em;margin-bottom:12px;padding:0 2px}
.stage-count{border-radius:999px;padding:2px 9px;background:transparent;font-weight:500}
.card{background:linear-gradient(180deg,var(--navy-3),#131a24);border-radius:12px;padding:12px 12px 12px 14px;margin-bottom:8px;position:relative;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s}
.card::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--gold);opacity:.35;transition:opacity .18s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border-gold)}
.card:hover::before{opacity:1}
.card-name{font-size:13.5px;font-weight:600;margin-bottom:3px}
.card-phone{font-size:11.5px}
.card-meta{color:var(--text-muted);font-size:11px;margin-top:6px}
.tag{font-size:10px;font-weight:500;padding:3px 9px;border-radius:999px;border:1px solid currentColor;border-color:color-mix(in srgb,currentColor 28%,transparent);letter-spacing:.02em}
.add-btn{border-radius:10px;padding:8px}

.modal-bg{background:rgba(4,6,10,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal{background:linear-gradient(180deg,var(--navy-3),var(--navy-2));padding:1.75rem;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
.modal h3{font-family:var(--serif);font-size:24px;font-weight:600;margin-bottom:1.25rem}
.form-row label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.form-row input,.form-row select,.form-row textarea{padding:10px 12px;border-radius:10px;background:var(--navy-2)}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.btn-primary{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#1a1305;border-radius:999px;padding:10px 22px;box-shadow:0 6px 18px -8px rgba(201,153,58,.6)}
.btn-primary:hover{background:linear-gradient(135deg,#ecc26a,var(--gold-2))}
.btn-sec{border-radius:999px;padding:10px 20px}

.section-title{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:1rem}
.origem-chart{gap:12px}
.origem-bar-wrap{height:6px;border-radius:999px}
.origem-bar{border-radius:999px}
.origem-label{font-size:12.5px;color:var(--cream-3)}

.filters{gap:10px;margin-bottom:1.25rem}
.filters select,.filters input{padding:9px 14px;border-radius:999px;background:var(--navy-2);transition:border-color .2s}
.leads-table{font-size:12.5px;border-collapse:separate;border-spacing:0}
.leads-table th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--border-gold);position:sticky;top:0;background:var(--navy)}
.leads-table td{padding:13px 14px}
.leads-table tr:hover td{background:rgba(22,29,40,.8)}

.detail-panel{background:linear-gradient(180deg,var(--navy-3),var(--navy-2));padding:1.75rem;box-shadow:var(--shadow)}
.detail-name{font-family:var(--serif);font-size:28px;font-weight:600}
.info-row{gap:10px}
.info-cell{background:var(--navy-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.info-cell .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.info-cell .v{font-size:13.5px}
.nota-box{border-radius:10px;padding:12px 14px}
.action-row{gap:10px}
.history-item{padding:9px 0}

@media(max-width:700px){header{padding:12px 16px}.main{padding:1.25rem 16px 2rem}.logo{font-size:18px}.metric .value{font-size:30px}.tabs{gap:18px;overflow-x:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="logo">CRM <span>Caio Lobato</span></div>
  <div style="display:flex;gap:8px">
    <button onclick="exportarBackup()" title="Baixa um arquivo com todos os leads">Backup</button>
    <button onclick="document.getElementById('file-backup').click()" title="Restaura leads de um backup">Restaurar</button>
    <input type="file" id="file-backup" accept=".json" hidden onchange="importarBackup(event)">
    <button id="sync-btn" onclick="semChave=false;syncFromSheets()">Sincronizar</button>
    <button class="btn-new" onclick="openModal('Lead')">+ Novo lead</button>
  </div>
</header>

<div class="main">
  <div class="tabs">
    <button class="tab active" onclick="showTab('pipeline')">Pipeline</button>
    <button class="tab" onclick="showTab('leads')">Todos os leads</button>
    <button class="tab" onclick="showTab('origens')">Origens</button>
  </div>

  <div id="tab-pipeline" class="pane active">
    <div class="metrics" id="metrics-bar"></div>
    <div class="pipeline" id="pipeline-cols"></div>
  </div>

  <div id="tab-leads" class="pane">
    <div class="filters">
      <input type="text" id="search-input" placeholder="Buscar lead..." oninput="renderLeadsTable()" style="width:180px">
      <select id="filter-origem" onchange="renderLeadsTable()"><option value="">Todas origens</option></select>
      <select id="filter-stage" onchange="renderLeadsTable()"><option value="">Todos estágios</option></select>
    </div>
    <div style="overflow-x:auto">
      <table class="leads-table"><thead><tr><th>Nome</th><th>Telefone</th><th>Origem</th><th>Campanha</th><th>Botão</th><th>Dispositivo</th><th>Estágio</th><th>Data</th></tr></thead><tbody id="leads-tbody"></tbody></table>
    </div>
    <div class="detail-panel" id="detail-panel"></div>
  </div>

  <div id="tab-origens" class="pane">
    <div class="metrics" id="origem-metrics"></div>
    <div style="margin-top:1rem"><p class="section-title">Leads por canal</p><div class="origem-chart" id="origem-chart"></div></div>
    <div style="margin-top:1.5rem"><p class="section-title">Leads por campanha UTM</p><div id="utm-chart" class="origem-chart"></div></div>
  </div>

</div>

<!-- Modal novo/editar lead -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3 id="modal-title">Novo lead</h3>
    <div class="form-row"><label>Nome *</label><input id="f-nome" placeholder="Nome completo"></div>
    <div class="form-grid">
      <div class="form-row"><label>WhatsApp / Telefone</label><input id="f-wa" placeholder="41999999999"></div>
      <div class="form-row"><label>Origem *</label>
        <select id="f-origem">
          
        </select>
      </div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>Estágio</label>
        <select id="f-stage"><option>Lead</option><option>Contato</option><option>Proposta</option><option>Negociação</option><option>Fechado</option><option>Perdido</option></select>
      </div>
      <div class="form-row"><label>Campanha UTM</label><input id="f-utm" placeholder="ex: clinica-curitiba"></div>
    </div>
    <div class="form-row"><label>Anotação</label><textarea id="f-nota" placeholder="Observações sobre o lead..."></textarea></div>
    <div class="modal-actions">
      <button class="btn-sec" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveLead()">Salvar lead</button>
    </div>
  </div>
</div>

<script>
const STAGES=['Lead','Contato','Proposta','Negociação','Fechado','Perdido'];
const ORIGENS=['Meta Ads','Google Ads','Instagram Orgânico','Google Orgânico','Google Meu Negócio','Facebook Orgânico','Indicação','WhatsApp Direto','Referência','Direto','Site','Outro'];
const ORIGEM_COLORS={'Meta Ads':'#6aaee8','Google Ads':'#8fc45a','Instagram Orgânico':'#e88aaa','Google Orgânico':'#b7d98a','Google Meu Negócio':'#6fbf9a','Facebook Orgânico':'#8fbfe8','Indicação':'#e0b55a','WhatsApp Direto':'#5dd4b0','Referência':'#d9b56a','Direto':'#cdc8be','Orgânico':'#a9a3f5','Site':'#a9a3f5','Outro':'#cdc8be'};
const SHEETS_URL='https://script.google.com/macros/s/AKfycbz556lD8XSHaLARrOLheZZUkv5icXZouoqyvYj0DyztxsPkUoK7rz6v4kfmhDvKzME/exec';

function getLeads(){try{const l=JSON.parse(localStorage.getItem('crm_leads')||'[]');return Array.isArray(l)?l:[]}catch(e){return []}}
function getIgnorados(){try{return new Set(JSON.parse(localStorage.getItem('crm_ignorados')||'[]'))}catch(e){return new Set()}}
function saveIgnorados(s){localStorage.setItem('crm_ignorados',JSON.stringify([...s]))}
function getSiteStats(){try{return JSON.parse(localStorage.getItem('crm_site_stats')||'null')}catch(e){return null}}
function hoje(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtData(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]:(s||'')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function campo(r,...nomes){for(const n of nomes){const v=r[norm(n)];if(v!==undefined&&v!==null&&String(v).trim()!=='')return String(v).trim()}return ''}
function parseData(v){
  if(!v)return hoje();
  const br=/^(\d{2})\/(\d{2})\/(\d{4})/.exec(v);
  if(br)return br[3]+'-'+br[2]+'-'+br[1];
  if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
  const d=new Date(v);
  if(isNaN(d))return hoje();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function saveLeads(l){localStorage.setItem('crm_leads',JSON.stringify(l))}

let editId=null;
let syncando=false;
let semChave=false;

function ctaLabel(c){
  const m={hero:'Botão principal',nav:'Menu',final:'Chamada final',float:'Botão flutuante',rodape:'Rodapé'};
  const k=(c.info&&c.info.cta)||'';
  return m[k]||k;
}

function montarInfo(r){
  return {
    utm_source:campo(r,'utm_source'),utm_campaign:campo(r,'utm_campaign'),utm_medium:campo(r,'utm_medium'),
    utm_content:campo(r,'utm_content'),utm_term:campo(r,'utm_term'),cta:campo(r,'cta'),
    dispositivo:campo(r,'dispositivo'),pagina:campo(r,'pagina'),referrer:campo(r,'referrer'),
    primeira_pagina:campo(r,'primeira_pagina'),gclid:campo(r,'gclid'),gbraid:campo(r,'gbraid'),
    wbraid:campo(r,'wbraid'),fbclid:campo(r,'fbclid')
  };
}

function infoHtml(c){
  const i=c.info;if(!i)return '';
  const curto=v=>v.length>22?v.slice(0,22)+'...':v;
  const cel=(k,v,cls)=>v?`<div class="info-cell${cls?' wide':''}"><div class="k">${k}</div><div class="v${cls?' small':''}">${esc(v)}</div></div>`:'';
  const click=[i.gclid&&'Google (gclid): '+curto(i.gclid),i.gbraid&&'Google (gbraid): '+curto(i.gbraid),i.wbraid&&'Google (wbraid): '+curto(i.wbraid),i.fbclid&&'Meta (fbclid): '+curto(i.fbclid)].filter(Boolean).join(' | ');
  const html=[
    cel('Fonte (UTM Source)',i.utm_source),cel('Campanha',i.utm_campaign),cel('Mídia (UTM Medium)',i.utm_medium),
    cel('Criativo (UTM Content)',i.utm_content),cel('Termo (UTM Term)',i.utm_term),cel('Botão clicado',ctaLabel(c)),
    cel('Dispositivo',i.dispositivo),cel('Click ID',click,1),cel('Referrer',i.referrer,1),
    cel('Página',i.pagina,1),cel('Primeira página',i.primeira_pagina,1)
  ].join('');
  if(!html)return '';
  return `<p style="font-size:12px;font-weight:500;margin:4px 0 6px;color:var(--cream)">Origem do lead</p><div class="info-row" style="margin-bottom:1rem">${html}</div>`;
}

async function syncFromSheets(){
  if(syncando||semChave)return;
  syncando=true;
  const syncBtn=document.getElementById('sync-btn');
  const setBtn=t=>{if(syncBtn)syncBtn.textContent=t};
  setBtn('Sincronizando...');
  try{
    let chave=localStorage.getItem('crm_chave')||'';
    if(!chave){
      chave=(prompt('Chave de acesso do CRM:')||'').trim();
      if(!chave){semChave=true;setBtn('Sincronizar');return}
      localStorage.setItem('crm_chave',chave);
    }
    const url=SHEETS_URL+'?k='+encodeURIComponent(chave);
    const res=await fetch(url);
    const rows=await res.json();
    if(!Array.isArray(rows)){
      if(rows&&rows.status==='negado'){localStorage.removeItem('crm_chave');semChave=true;setBtn('Chave inválida');return}
      throw new Error('resposta inesperada');
    }
    const local=getLeads();
    const ids=new Set(local.map(x=>x.sheetsId).filter(Boolean));
    const ign=getIgnorados();
    const porSid=new Map(local.filter(x=>x.sheetsId).map(x=>[x.sheetsId,x]));
    let added=0,mudou=false;
    rows.forEach(row=>{
      const r={};
      for(const k in row)r[norm(k)]=row[k];
      const eid=campo(r,'event_id');
      // sem Event ID (leads antigos ou de outros sites) mantem a chave antiga Data + Nome
      const sid=eid||((row['Data']||'')+'_'+(row['Nome']||''));
      if(ign.has(sid))return;
      if(ids.has(sid)){const ex=porSid.get(sid);if(ex&&!ex.info){ex.info=montarInfo(r);mudou=true}return}
      ids.add(sid);
      const data=parseData(campo(r,'data'));
      const codigo=campo(r,'codigo');
      let nome=campo(r,'nome');
      if(!nome||/^lead via /i.test(nome))nome=codigo?'Lead '+codigo:'Lead via site';
      const disp=campo(r,'dispositivo');
      local.push({
        id:Date.now()+Math.random(),
        sheetsId:sid,
        nome,
        wa:campo(r,'telefone').replace(/\D/g,''),
        origem:campo(r,'origem')||'Site',
        stage:'Lead',
        utm:campo(r,'utm_campaign','utm_source'),
        nota:'',
        info:montarInfo(r),
        ref:codigo,
        history:[{txt:'Lead capturado via site'+(disp?' ('+disp+')':'')+(codigo?', ref '+codigo:''),date:data}],
        date:data
      });
      added++;
    });
    if(added>0||mudou)saveLeads(local);
    // visitas: so existe no Apps Script novo (acao=stats). No antigo a resposta e ignorada.
    let statsMudou=false;
    try{
      const st=await (await fetch(url+'&acao=stats')).json();
      if(st&&typeof st.visitas==='number'){
        const novo=JSON.stringify({visitas:st.visitas,leads:st.leads});
        if(novo!==localStorage.getItem('crm_site_stats')){localStorage.setItem('crm_site_stats',novo);statsMudou=true}
      }
    }catch(e){}
    if(added>0||mudou||statsMudou)renderAll();
    setBtn('Sincronizar'+(added>0?' (+'+added+' novos)':''));
    setTimeout(()=>setBtn('Sincronizar'),4000);
  }catch(err){
    setBtn('Erro ao sincronizar');
    setTimeout(()=>setBtn('Sincronizar'),4000);
  }finally{syncando=false}
}

function deleteLead(id){
  const l=getLeads();const c=l.find(x=>x.id===id);if(!c)return;
  if(!confirm('Excluir "'+c.nome+'"? Essa ação não pode ser desfeita.'))return;
  if(c.sheetsId){const ign=getIgnorados();ign.add(c.sheetsId);saveIgnorados(ign)}
  saveLeads(l.filter(x=>x.id!==id));
  document.getElementById('detail-panel').className='detail-panel';
  renderAll();
}

function exportarBackup(){
  const dados={versao:1,leads:getLeads(),ignorados:[...getIgnorados()]};
  const blob=new Blob([JSON.stringify(dados,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='crm-backup-'+hoje()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function importarBackup(ev){
  const f=ev.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d||!Array.isArray(d.leads))throw new Error('formato');
      if(!confirm('Substituir os '+getLeads().length+' leads atuais pelos '+d.leads.length+' do backup?'))return;
      saveLeads(d.leads);
      localStorage.setItem('crm_ignorados',JSON.stringify(Array.isArray(d.ignorados)?d.ignorados:[]));
      renderAll();
    }catch(e){alert('Arquivo de backup inválido')}
  };
  rd.readAsText(f);ev.target.value='';
}

function init(){
  renderAll();populateFilters();
  syncFromSheets();
  setInterval(()=>{if(!document.hidden)syncFromSheets()},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncFromSheets()});
}

function refreshOrigens(){
  const usadas=[...ORIGENS];
  getLeads().forEach(x=>{if(x.origem&&!usadas.includes(x.origem))usadas.push(x.origem)});
  const opts=usadas.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
  const fo=document.getElementById('filter-origem');
  if(fo){const v=fo.value;fo.innerHTML='<option value="">Todas origens</option>'+opts;fo.value=v}
  const fm=document.getElementById('f-origem');
  if(fm){const v=fm.value;fm.innerHTML=opts;if(v)fm.value=v}
}
function garantirOpcao(o){
  const fm=document.getElementById('f-origem');
  if(o&&fm&&![...fm.options].some(x=>x.value===o)){const opt=document.createElement('option');opt.value=o;opt.textContent=o;fm.appendChild(opt)}
}
function waLink(wa){const d=String(wa).replace(/\D/g,'');return 'https://wa.me/'+(d.length>=12?d:'55'+d)}

function renderAll(){refreshOrigens();renderMetrics();renderPipeline();renderLeadsTable();renderOrigens()}

function renderMetrics(){
  const l=getLeads();
  const ativos=l.filter(x=>x.stage!=='Perdido'&&x.stage!=='Fechado');
  const fechados=l.filter(x=>x.stage==='Fechado');
  const convRate=l.length>0?Math.round(fechados.length/l.length*100):0;
  const st=getSiteStats();
  const visitaCard=st&&st.visitas>0?`<div class="metric"><div class="label">Visitas no site</div><div class="value">${st.visitas}</div><div class="sub">${(st.leads/st.visitas*100).toFixed(1).replace('.',',')}% clicam no WhatsApp</div></div>`:'';
  document.getElementById('metrics-bar').innerHTML=`
    <div class="metric"><div class="label">Total de leads</div><div class="value">${l.length}</div><div class="sub">todos os estágios</div></div>
    <div class="metric"><div class="label">Em pipeline</div><div class="value">${ativos.length}</div><div class="sub">leads ativos</div></div>
    <div class="metric"><div class="label">Fechados</div><div class="value">${fechados.length}</div><div class="sub">total</div></div>
    <div class="metric"><div class="label">Taxa de conversão</div><div class="value">${convRate}%</div><div class="sub">${fechados.length} fechados</div></div>
    ${visitaCard}
  `;
}

function formatPhone(wa){
  let d=String(wa||'').replace(/\D/g,'');
  if(d.length>=12&&d.startsWith('55'))d=d.slice(2);
  if(d.length===11)return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
  if(d.length===10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);
  return wa;
}

function origemClass(o){
  const m={'Meta Ads':'meta','Google Ads':'google','Instagram Orgânico':'instagram','Google Orgânico':'google','Google Meu Negócio':'google','Facebook Orgânico':'meta','Indicação':'indicacao','Referência':'indicacao','WhatsApp Direto':'whatsapp','Site':'site','Orgânico':'site'};
  return m[o]||'outro';
}

function renderLeadsTable(){
  const l=getLeads();
  const search=(document.getElementById('search-input')||{value:''}).value.toLowerCase();
  const fo=(document.getElementById('filter-origem')||{value:''}).value;
  const fs=(document.getElementById('filter-stage')||{value:''}).value;
  const filtered=l.filter(x=>{
    const sd=search.replace(/\D/g,'');
    if(search&&!((x.nome||'').toLowerCase().includes(search)||(x.nota||'').toLowerCase().includes(search)||(x.ref||'').toLowerCase().includes(search)||(sd&&(x.wa||'').includes(sd))))return false;
    if(fo&&x.origem!==fo)return false;
    if(fs&&x.stage!==fs)return false;
    return true;
  });
  const tbody=document.getElementById('leads-tbody');
  if(!tbody)return;
  tbody.innerHTML=filtered.map(c=>`
    <tr onclick="openDetailTab(${c.id})">
      <td>${esc(c.nome)}</td>
      <td>${c.wa?formatPhone(c.wa):'—'}</td>
      <td><span class="tag tag-${origemClass(c.origem)}">${esc(c.origem)}</span></td>
      <td>${esc(c.utm)||'—'}</td>
      <td>${esc(ctaLabel(c))||'—'}</td>
      <td>${esc(c.info&&c.info.dispositivo)||'—'}</td>
      <td>${c.stage}</td>
      <td>${c.date?fmtData(c.date):'—'}</td>
    </tr>
  `).join('');
}

function populateFilters(){
  const fs=document.getElementById('filter-stage');
  if(!fs)return;
  STAGES.forEach(s=>{const opt=document.createElement('option');opt.value=s;opt.textContent=s;fs.appendChild(opt)});
}

function renderOrigens(){
  const l=getLeads();
  const byOrigem={};const byUtm={};
  const fechados=l.filter(x=>x.stage==='Fechado');
  l.forEach(x=>{byOrigem[x.origem]=(byOrigem[x.origem]||0)+1;if(x.utm)byUtm[x.utm]=(byUtm[x.utm]||0)+1});
  const maxO=Math.max(...Object.values(byOrigem),1);
  const topOrigem=Object.entries(byOrigem).sort((a,b)=>b[1]-a[1]);

  const om=document.getElementById('origem-metrics');
  if(om){
    const topCh=topOrigem[0]||['—',0];
    om.innerHTML=`
      <div class="metric"><div class="label">Canais ativos</div><div class="value">${topOrigem.length}</div></div>
      <div class="metric"><div class="label">Maior canal</div><div class="value" style="font-size:15px">${esc(topCh[0])}</div><div class="sub">${topCh[1]} leads</div></div>
      <div class="metric"><div class="label">Campanhas UTM</div><div class="value">${Object.keys(byUtm).length}</div></div>
      <div class="metric"><div class="label">Fechados</div><div class="value">${fechados.length}</div><div class="sub">total</div></div>
    `;
  }

  const oc=document.getElementById('origem-chart');
  if(oc)oc.innerHTML=topOrigem.map(([o,n])=>`
    <div class="origem-row">
      <span class="origem-label">${esc(o)}</span>
      <div class="origem-bar-wrap"><div class="origem-bar" style="width:${Math.round(n/maxO*100)}%;background:${ORIGEM_COLORS[o]||'#888'}"></div></div>
      <span class="origem-count">${n}</span>
    </div>
  `).join('');

  const uc=document.getElementById('utm-chart');
  if(uc){
    const utmList=Object.entries(byUtm).sort((a,b)=>b[1]-a[1]);
    const maxU=Math.max(...utmList.map(x=>x[1]),1);
    uc.innerHTML=utmList.length?utmList.map(([u,n])=>`
      <div class="origem-row">
        <span class="origem-label" style="font-family:var(--font-mono);font-size:11px">${esc(u)}</span>
        <div class="origem-bar-wrap"><div class="origem-bar" style="width:${Math.round(n/maxU*100)}%;background:var(--gold)"></div></div>
        <span class="origem-count">${n}</span>
      </div>
    `).join(''):'<p style="font-size:12px;color:var(--text-muted)">Nenhum lead com UTM ainda.</p>';
  }
}

function openModal(stage){
  editId=null;
  document.getElementById('modal-title').textContent='Novo lead';
  ['f-nome','f-wa','f-utm','f-nota'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-origem').value='Meta Ads';
  document.getElementById('f-stage').value=stage||'Lead';
  document.getElementById('modal-bg').style.display='flex';
}

function closeModal(){document.getElementById('modal-bg').style.display='none'}

function saveLead(){
  const nome=document.getElementById('f-nome').value.trim();
  if(!nome){alert('Nome obrigatório');return}
  const l=getLeads();
  const now=hoje();
  if(editId){
    const i=l.findIndex(x=>x.id===editId);
    if(i>=0)l[i]={...l[i],nome,wa:document.getElementById('f-wa').value.replace(/\D/g,''),origem:document.getElementById('f-origem').value,stage:document.getElementById('f-stage').value,utm:document.getElementById('f-utm').value,nota:document.getElementById('f-nota').value};
  }else{
    l.push({id:Date.now(),nome,wa:document.getElementById('f-wa').value.replace(/\D/g,''),origem:document.getElementById('f-origem').value,stage:document.getElementById('f-stage').value,utm:document.getElementById('f-utm').value,nota:document.getElementById('f-nota').value,history:[{txt:'Lead criado',date:now}],date:now});
  }
  saveLeads(l);closeModal();renderAll();
}

      <button class="btn-sec" onclick="editLead(${c.id})">Editar</button>
      <button class="btn-sec" onclick="deleteLead(${c.id})">Excluir</button>
      ${c.wa?`<a href="${waLink(c.wa)}" target="_blank" rel="noopener"><button class="btn-sec">WhatsApp</button></a>`:''}
    </div>
    <p style="font-size:12px;font-weight:500;margin-bottom:6px;color:var(--cream)">Histórico</p>
    <div>${(c.history||[]).map(h=>`<div class="history-item"><span class="history-date">${fmtData(h.date)}</span> - ${esc(h.txt)}</div>`).join('')}</div>
    <div class="add-hist">
      <input id="new-hist-${c.id}" placeholder="Registrar interação...">
      <button class="btn-primary" onclick="addHistory(${c.id})">+ Registrar</button>
    </div>
  `;
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function moveStage(id,dir){
  const l=getLeads();const i=l.findIndex(x=>x.id===id);if(i<0)return;
  const si=STAGES.indexOf(l[i].stage);const ni=si+dir;
  if(ni<0||ni>=STAGES.length)return;
  l[i].stage=STAGES[ni];
  const now=hoje();
  l[i].history=l[i].history||[];
  l[i].history.push({txt:'Movido para '+STAGES[ni],date:now});
  saveLeads(l);renderAll();openDetailTab(id);
}

function addHistory(id){
  const inp=document.getElementById('new-hist-'+id);
  if(!inp||!inp.value.trim())return;
  const l=getLeads();const i=l.findIndex(x=>x.id===id);if(i<0)return;
  l[i].history=l[i].history||[];
  l[i].history.push({txt:inp.value.trim(),date:hoje()});
  saveLeads(l);openDetailTab(id);
}

function editLead(id){
  const l=getLeads();const c=l.find(x=>x.id===id);if(!c)return;
  editId=id;
  document.getElementById('modal-title').textContent='Editar lead';
  document.getElementById('f-nome').value=c.nome;
  document.getElementById('f-wa').value=c.wa?formatPhone(c.wa):'';
  garantirOpcao(c.origem);document.getElementById('f-origem').value=c.origem;
  document.getElementById('f-stage').value=c.stage;
  document.getElementById('f-utm').value=c.utm||'';
  document.getElementById('f-nota').value=c.nota||'';
  document.getElementById('modal-bg').style.display='flex';
}

function showTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{const names=['pipeline','leads','origens'];t.className='tab'+(names[i]===name?' active':'')});
  document.querySelectorAll('.pane').forEach(p=>p.className='pane');
  document.getElementById('tab-'+name).className='pane active';
  if(name==='origens')renderOrigens();
}

document.getElementById('modal-bg').addEventListener('click',function(e){if(e.target===this)closeModal()});
init();
</script>
</body>
</html>
